name: GTA VI Weekly Preview
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode specification slug in gta6/weekly
        type: string
        default: recording-audio
  push:
    branches: [gta6-weekly-pilot]
    paths:
      - .github/workflows/gta6-weekly-preview.yml
      - gta6/weekly_preview.py
      - gta6/weekly/**
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Piper and Pillow
        timeout-minutes: 3
        run: python -m pip install --timeout 25 --retries 2 'piper-tts==1.8.0' 'Pillow>=10,<13'
      - name: Download and verify the narration voice
        timeout-minutes: 4
        run: |
          voice_dir="$RUNNER_TEMP/voices"
          mkdir -p "$voice_dir"
          cd "$voice_dir"
          base='https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ljspeech/medium/en_US-ljspeech-medium'
          curl -fLsS --retry 2 --max-time 90 "$base.onnx?download=true" -o en_US-ljspeech-medium.onnx
          curl -fLsS --retry 2 --max-time 30 "$base.onnx.json?download=true" -o en_US-ljspeech-medium.onnx.json
          sha256sum -c <<'CHECKSUMS'
          6f52a751e2349abe7a76735eb09dc1875298c77ea2342ffd2fef79ff81b87f22  en_US-ljspeech-medium.onnx
          141d612cc0a95ed7efc1ca936b845c2364967f2e9217c5dbfcf69fc4d6c65860  en_US-ljspeech-medium.onnx.json
          CHECKSUMS
      - name: Install FFmpeg and FFprobe
        timeout-minutes: 4
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then exit 0; fi
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 2 --max-time 90 \
            'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-23-12-43/ffmpeg-n8.1.3-39-g660b5aa7db-linux64-gpl-8.1.tar.xz' -o ffmpeg.tar.xz
          echo '255b73431adc3c14f91533b6cf08090c0b1314f6789761140a196f820f6347a2  ffmpeg.tar.xz' | sha256sum -c
          mkdir -p ffmpeg-bin
          tar -xJf ffmpeg.tar.xz --strip-components=2 -C ffmpeg-bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      - name: Render and verify one episode and three Shorts
        env:
          EPISODE: ${{ inputs.episode || 'recording-audio' }}
        run: |
          if [[ ! "$EPISODE" =~ ^[a-z0-9-]+$ ]]; then exit 2; fi
          python gta6/weekly_preview.py "gta6/weekly/$EPISODE.json" \
            --model "$RUNNER_TEMP/voices/en_US-ljspeech-medium.onnx" \
            --out gta6-output/weekly
      - uses: actions/upload-artifact@v4
        with:
          name: gta6-weekly-preview
          path: gta6-output/weekly/
          retention-days: 3
          if-no-files-found: error
