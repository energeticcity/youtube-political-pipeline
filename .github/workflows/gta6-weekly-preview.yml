name: GTA VI Weekly Generator Check
on:
  workflow_dispatch:
    inputs:
      episode:
        type: string
        default: weekly
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Generate and review a separate future topic without publishing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from gta6.weekly_autoplan import TOPICS, write_story
          briefs = json.loads((TOPICS / "briefs.json").read_text())
          seed = json.loads((TOPICS / "hud-readability.json").read_text())
          template = {key: seed[key] for key in ("footage", "footage_credit")}
          result = write_story(briefs[0], [seed["title"]], template, "2026-12-07")
          print(json.dumps({"title": result["title"], "chapters": len(result["chapters"]),
                            "shorts": sum("short_title" in chapter for chapter in result["chapters"]),
                            "words": sum(len(line.split()) for chapter in result["chapters"] for line in chapter["lines"]),
                            "source_review": "passed"}))
          PY
