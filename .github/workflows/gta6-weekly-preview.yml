name: Inspect scheduled GTA VI HUD YouTube release
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency: gta6-hud-december-release
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Confirm the existing YouTube ID without uploading
        env:
          GH_TOKEN: ${{ github.token }}
          GTA6_YOUTUBE_API_CLIENT_ID: ${{ secrets.GTA6_YOUTUBE_API_CLIENT_ID }}
          GTA6_YOUTUBE_API_CLIENT_SECRET: ${{ secrets.GTA6_YOUTUBE_API_CLIENT_SECRET }}
          GTA6_YOUTUBE_API_REFRESH_TOKEN: ${{ secrets.GTA6_YOUTUBE_API_REFRESH_TOKEN }}
        run: |
          python - <<'PYTHON'
          import json
          from gta6.weekly_autoplan import load_plan
          from gta6.weekly_youtube import verify_public, videos, youtube_api_client

          plan = load_plan("gta6/weekly-plans/2026-11-30--hud-readability.json")
          release = plan["scheduled_release"]
          assert release["video_id"] == "ascnC6WCd2o"
          token, _ = youtube_api_client()
          headers = {"Authorization": f"Bearer {token}"}
          duration = verify_public(headers, release["video_id"], plan["title"], plan["description"],
                                   release=release, scheduled_at=release["publish_at"])
          item = videos(headers, [release["video_id"]])[0]
          print(json.dumps({"id": release["video_id"], "scheduled": item["status"]["publishAt"],
                            "title": item["snippet"]["title"], "description": "verified",
                            "custom_thumbnail": item["contentDetails"].get("hasCustomThumbnail"),
                            "duration": duration}))
          PYTHON
