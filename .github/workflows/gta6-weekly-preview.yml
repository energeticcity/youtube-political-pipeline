name: GTA VI Weekly Preview
on:
  schedule:
    - cron: '17 18 * * 2'
      timezone: America/Dawson_Creek
  workflow_dispatch:
    inputs:
      episode:
        description: Episode specification slug or weekly to select the current batch
        type: string
        default: weekly
  push:
    branches: [gta6-weekly-pilot]
    paths:
      - .github/workflows/gta6-weekly-preview.yml
      - gta6/weekly_preview.py
      - gta6/weekly_schedule.py
      - gta6/weekly/**
permissions:
  contents: read
concurrency:
  group: gta6-weekly-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: episode
        name: Select the assigned weekly episode
        env:
          EPISODE: ${{ inputs.episode || 'weekly' }}
        run: python3 gta6/weekly_schedule.py
      - uses: actions/setup-python@v5
        if: steps.episode.outputs.episode != ''
        with:
          python-version: '3.12'
      - name: Install Kokoro and Pillow
        if: steps.episode.outputs.episode != ''
        timeout-minutes: 3
        run: python -m pip install --timeout 25 --retries 2 'kokoro-onnx==0.4.7' 'Pillow>=10,<13'
      - name: Download and verify narration and music assets
        if: steps.episode.outputs.episode != ''
        timeout-minutes: 4
        run: |
          audio_dir="$RUNNER_TEMP/weekly-audio"
          mkdir -p "$audio_dir"
          cd "$audio_dir"
          base='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0'
          curl -fLsS --retry 2 --max-time 90 "$base/kokoro-v1.0.int8.onnx" -o kokoro.onnx
          curl -fLsS --retry 2 --max-time 60 "$base/voices-v1.0.bin" -o voices.bin
          curl -fLsS --retry 2 --max-time 30 \
            'https://www.scottbuckley.com.au/library/wp-content/uploads/2020/09/sb_electricdreams.mp3' -o electric-dreams.mp3
          sha256sum -c <<'CHECKSUMS'
          6e742170d309016e5891a994e1ce1559c702a2ccd0075e67ef7157974f6406cb  kokoro.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices.bin
          7c570cd7f2d0611fca3d6e411490bc22e1c95473a93583e93888cbb0472ddcb4  electric-dreams.mp3
          CHECKSUMS
      - name: Install FFmpeg and FFprobe
        if: steps.episode.outputs.episode != ''
        timeout-minutes: 4
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then exit 0; fi
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 2 --max-time 90 \
            'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-23-12-43/ffmpeg-n8.1.3-39-g660b5aa7db-linux64-gpl-8.1.tar.xz' -o ffmpeg.tar.xz
          echo '255b73431adc3c14f91533b6cf08090c0b1314f6789761140a196f820f6347a2  ffmpeg.tar.xz' | sha256sum -c
          mkdir -p ffmpeg-bin
          tar -xJf ffmpeg.tar.xz --strip-components=2 -C ffmpeg-bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      - name: Download Rockstar game footage
        if: steps.episode.outputs.episode != ''
        timeout-minutes: 7
        run: |
          footage="$RUNNER_TEMP/weekly-footage"
          mkdir -p "$footage"
          cd "$footage"
          base='https://media-rockstargames-com.akamaized.net/VI/downloads/videos'
          curl -fLsS --retry 1 --max-time 165 \
            "$base/GTAVI_Out_Now/GTAVI_Out_Now.mp4?weekly=1" -o out.mp4
          curl -fLsS --retry 1 --max-time 190 \
            "$base/GTAVI_Launch_Trailer/GTAVI_Launch_Trailer.mp4?weekly=1" -o launch.mp4
          sha256sum -c <<'CHECKSUMS'
          cfcdd1651934bee90e9fcba9567a7b0f6f11328d559e48b3229f275691268da3  out.mp4
          CHECKSUMS
          test "$(wc -c < launch.mp4)" -eq 781762562
      - name: Render and verify one episode and three Shorts
        if: steps.episode.outputs.episode != ''
        env:
          EPISODE: ${{ steps.episode.outputs.episode }}
        run: |
          if [[ ! "$EPISODE" =~ ^[a-z0-9-]+$ ]]; then exit 2; fi
          python gta6/weekly_preview.py "gta6/weekly/$EPISODE.json" \
            --model "$RUNNER_TEMP/weekly-audio/kokoro.onnx" \
            --voices "$RUNNER_TEMP/weekly-audio/voices.bin" \
            --music "$RUNNER_TEMP/weekly-audio/electric-dreams.mp3" \
            --footage-dir "$RUNNER_TEMP/weekly-footage" \
            --out gta6-output/weekly
      - uses: actions/upload-artifact@v4
        if: steps.episode.outputs.episode != ''
        with:
          name: gta6-weekly-preview
          path: gta6-output/weekly/
          retention-days: 3
          if-no-files-found: error
