name: Archive Pipeline Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3' 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests -v
      - name: Verify production main environment
        run: GITHUB_REF=refs/heads/main GITHUB_ACTIONS=true python -m unittest discover -s tests -v
      - run: node --test gta6/cloud-timer/worker.test.mjs
      - run: python archive_pipeline.py check
