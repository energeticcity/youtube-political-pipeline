name: Prepare Encrypted Local Instagram Login
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt-for-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'cryptography>=43,<47'
      - name: Encrypt credentials for the local uploader
        env:
          IG_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          IG_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
        run: |
          python - <<'PY'
          import os,json,base64
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          public=serialization.load_pem_public_key(Path('gta6/cli-credential-transfer-public.pem').read_bytes())
          values={name:os.environ[name] for name in ['IG_USERNAME','IG_PASSWORD','IG_SESSION']}
          assert values['IG_USERNAME'] and values['IG_PASSWORD'], 'Required credentials are missing'
          key=AESGCM.generate_key(bit_length=256)
          nonce=os.urandom(12)
          aad=b'gta6-instagram-cli-login'
          cipher=AESGCM(key).encrypt(nonce,json.dumps(values).encode(),aad)
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          encode=lambda b:base64.b64encode(b).decode()
          Path('encrypted-instagram-credentials.json').write_text(json.dumps({
              'algorithm':'RSA-OAEP-SHA256+AES-256-GCM','key':encode(wrapped),
              'nonce':encode(nonce),'ciphertext':encode(cipher)}))
          print('Encrypted credential bundle prepared. No credential values were logged.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-instagram-login
          path: encrypted-instagram-credentials.json
          retention-days: 1
