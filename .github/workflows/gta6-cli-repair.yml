name: Check CLI Login Repairs
on:
  workflow_dispatch:
    inputs:
      platform:
        description: CLI connection to test
        type: choice
        default: all
        options: [all, instagram, tiktok]
permissions:
  contents: read
jobs:
  instagram-password-login:
    if: inputs.platform == 'all' || inputs.platform == 'instagram'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upstream login diagnostic CLI
        run: |
          git clone https://github.com/subzeroid/instagrapi.git /tmp/instagrapi
          git -C /tmp/instagrapi checkout fbac391bb415187bddea9b4805a7b26960d73828
          pip install /tmp/instagrapi
      - name: Test saved credentials without displaying them
        env:
          IG_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          IG_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          assert os.environ.get('IG_USERNAME','').strip(), 'No Instagram login identifier secret configured'
          assert os.environ.get('IG_PASSWORD'), 'No Instagram password secret configured'
          folder=Path(os.environ['RUNNER_TEMP'])
          report=folder/'ig-login-report.json'
          settings=folder/'ig-private-settings.json'
          p=subprocess.run(['python','/tmp/instagrapi/examples/diagnose_login.py',
                            '--settings',str(settings),'--report',str(report),'--relogin'],
                           capture_output=True,text=True,stdin=subprocess.DEVNULL,timeout=420)
          data=json.loads(report.read_text()) if report.exists() else {}
          safe={k:data.get(k) for k in ['outcome','exception','last_json','environment','settings_saved']}
          safe['upstream_cli_exit_code']=p.returncode
          safe['expected_account']='@gtaviclipfix'
          if not p.returncode:
              from instagrapi import Client
              client=Client(settings=json.loads(settings.read_text()))
              try:
                  safe['target_identity_matches']=client.account_info().username.lower()=='gtaviclipfix'
              except Exception as exc:
                  safe['identity_lookup_error']=type(exc).__name__
          Path('cli-test-results').mkdir(exist_ok=True)
          Path('cli-test-results/instagram-password.json').write_text(json.dumps(safe,indent=2))
          print(json.dumps(safe,indent=2))
          if p.returncode or not safe.get('target_identity_matches'): raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-password-test
          path: cli-test-results/instagram-password.json
          retention-days: 7
          if-no-files-found: ignore
  tiktok-browser-cli:
    if: inputs.platform == 'all' || inputs.platform == 'tiktok'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the alternative upstream CLI
        run: pip install 'tiktok-uploader @ git+https://github.com/wkaisertexas/tiktok-uploader.git@1cea92dd4c815dbd5127ee4b3a0a7b6fabbaa5f0' 'autotok==2.1.0'
      - run: playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test browser CLI with private visibility guard
        env:
          GTA6_TIKTOK_SESSION: ${{ secrets.GTA6_TIKTOK_SESSION }}
        run: python gta6/cli_connection_test.py tiktok-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiktok-browser-test
          path: cli-test-results/tiktok-browser.json
          retention-days: 7
          if-no-files-found: ignore
