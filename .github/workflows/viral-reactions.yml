name: Viral Reaction Videos
on:
  workflow_dispatch:
  push:
    branches: [viral-reactions]
    paths:
      - reactions/**
      - .github/workflows/viral-reactions.yml
permissions:
  contents: read
concurrency:
  group: viral-reactions-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'kokoro-onnx==0.4.7' 'Pillow>=10,<13'
      - name: Install FFmpeg and verified narration assets
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p "$RUNNER_TEMP/reaction-audio"
          cd "$RUNNER_TEMP/reaction-audio"
          base='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0'
          curl -fLsS --retry 2 --max-time 90 "$base/kokoro-v1.0.int8.onnx" -o kokoro.onnx
          curl -fLsS --retry 2 --max-time 60 "$base/voices-v1.0.bin" -o voices.bin
          sha256sum -c <<'CHECKSUMS'
          6e742170d309016e5891a994e1ce1559c702a2ccd0075e67ef7157974f6406cb  kokoro.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices.bin
          CHECKSUMS
      - name: Render two narrated preview clips
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m reactions.pipeline preview "$RUNNER_TEMP/reaction-audio"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viral-reaction-previews
          path: |
            reaction-output/clip-*/reaction.mp4
            reaction-output/clip-*/receipt.json
          if-no-files-found: ignore
          retention-days: 5
