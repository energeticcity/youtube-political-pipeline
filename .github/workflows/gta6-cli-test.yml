name: Test Upstream Social CLIs
on:
  workflow_dispatch:
    inputs:
      platform:
        description: CLI to test
        type: choice
        default: all
        options: [all, tiktok, youtube, youtube-api, youtube-verify, weekly-oauth, weekly-private, instagram]
permissions:
  contents: read
concurrency:
  group: gta6-cli-tests
  cancel-in-progress: false
jobs:
  tiktok:
    if: inputs.platform == 'all' || inputs.platform == 'tiktok'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'autotok==2.1.0' 'requests>=2.32,<3'
      - run: python gta6/patch_autotok.py
      - run: playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify target account and run private CLI upload
        env:
          GTA6_TIKTOK_SESSION: ${{ secrets.GTA6_TIKTOK_SESSION }}
        run: python gta6/cli_connection_test.py tiktok
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-test-tiktok
          path: cli-test-results/tiktok.json
          retention-days: 7
          if-no-files-found: ignore
  youtube:
    if: inputs.platform == 'all' || inputs.platform == 'youtube' || inputs.platform == 'youtube-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned upstream YouTube Studio CLI
        run: |
          git clone https://github.com/dreammis/social-auto-upload.git /tmp/sau
          git -C /tmp/sau checkout 3847fff01f5434a8a32829833163cd6723cabc59
          cp /tmp/sau/conf.example.py /tmp/sau/conf.py
          git -C /tmp/sau apply "$GITHUB_WORKSPACE/gta6/social-auto-upload-youtube.patch"
          pip install -e /tmp/sau
      - if: inputs.platform != 'youtube-verify'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Check the exact YouTube channel and private test receipt
        env:
          SAU_REPO: /tmp/sau
          GTA6_YOUTUBE_BROWSER_SESSION: ${{ secrets.GTA6_YOUTUBE_BROWSER_SESSION }}
        run: python gta6/cli_connection_test.py "${{ inputs.platform == 'youtube-verify' && 'youtube-verify' || 'youtube' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-test-youtube
          path: |
            cli-test-results/youtube*.json
            cli-test-results/youtube-upload-screen.txt
          retention-days: 7
          if-no-files-found: ignore
  instagram:
    if: inputs.platform == 'all' || inputs.platform == 'instagram'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned upstream social-auto-upload
        run: |
          git clone https://github.com/dreammis/social-auto-upload.git /tmp/sau
          git -C /tmp/sau checkout 3847fff01f5434a8a32829833163cd6723cabc59
          cp /tmp/sau/conf.example.py /tmp/sau/conf.py
          git -C /tmp/sau apply "$GITHUB_WORKSPACE/gta6/social-auto-upload-instagram.patch"
          pip install -e /tmp/sau
      - name: Verify patched upstream browser regression tests
        working-directory: /tmp/sau
        run: python -m unittest discover -s tests -p test_instagram_uploader.py -v
      - name: Verify existing Instagram session through upstream CLI
        env:
          SAU_REPO: /tmp/sau
          IG_SESSION: ${{ secrets.GTA6_INSTAGRAM_BROWSER_SESSION }}
        run: python gta6/cli_connection_test.py instagram
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-test-instagram
          path: cli-test-results/instagram.json
          retention-days: 7
          if-no-files-found: ignore

  youtube-api:
    if: inputs.platform == 'youtube-api'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned upstream YouTube API CLI
        run: pip install 'youtube-upload @ git+https://github.com/tokland/youtube-upload.git@6a30b55d0fd4976571a5b9b34c01fd41cec49c7a' 'requests>=2.32,<3'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify exact channel and upload a private fixture
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.GTA6_YOUTUBE_API_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.GTA6_YOUTUBE_API_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.GTA6_YOUTUBE_API_REFRESH_TOKEN }}
        run: python gta6/cli_connection_test.py youtube-api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-test-youtube-api
          path: cli-test-results/youtube-api.json
          retention-days: 7
  weekly-oauth:
    if: inputs.platform == 'weekly-oauth'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify an existing OAuth connection for the exact GTA channel
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request, urllib.parse, urllib.error
          from pathlib import Path

          def read(req):
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, json.load(error)

          values = {key.lower(): os.environ.get(key, '') for key in ('CLIENT_ID', 'CLIENT_SECRET', 'REFRESH_TOKEN')}
          result = {'connection': 'missing_credentials', 'identity': 'unverified'}
          if all(values.values()):
              code, data = read(urllib.request.Request('https://oauth2.googleapis.com/token',
                  data=urllib.parse.urlencode(dict(values, grant_type='refresh_token')).encode()))
              if code == 200 and 'access_token' in data:
                  status, channels = read(urllib.request.Request(
                      'https://www.googleapis.com/youtube/v3/channels?part=id&mine=true',
                      headers={'Authorization': 'Bearer '+data['access_token']}))
                  result = {'connection': 'authenticated', 'channel_lookup_http': status,
                            'identity': 'matched' if [item['id'] for item in channels.get('items', [])]
                            == ['UCdL4ljG4SqfEA8qk5yd6v5w'] else 'unverified',
                            'upload_scope': any(scope.endswith(('/auth/youtube.upload', '/auth/youtube',
                                '/auth/youtube.force-ssl')) for scope in data.get('scope', '').split())}
              else:
                  error = data.get('error', '')
                  result = {'connection': error if error in ('deleted_client', 'invalid_grant', 'invalid_client',
                      'unauthorized_client') else 'token_exchange_failed', 'token_http': code, 'identity': 'unverified'}
          print(json.dumps(result))
          Path('weekly-oauth-proof.json').write_text(json.dumps(result))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-oauth-proof
          path: weekly-oauth-proof.json
          retention-days: 3
  weekly-private:
    if: inputs.platform == 'weekly-private'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gta6-weekly-preview
          github-token: ${{ github.token }}
          run-id: '45310860016'
          path: weekly-verified-input
      - run: python3 -m pip install 'requests>=2.32,<3'
      - name: Verify and upload the episode as private to the existing YouTube account
        env:
          POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
        run: python3 -m gta6.weekly_delivery_probe weekly-verified-input
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-delivery-proof
          path: weekly-delivery-proof.json
          retention-days: 3
          if-no-files-found: ignore
