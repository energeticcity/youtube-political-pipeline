name: GTA6 Hourly Publisher
run-name: GTA6 cloud ${{ inputs.operation || 'hourly check' }} (${{ inputs.timer_source || github.event_name }})
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Cloud pipeline action
        type: choice
        default: dry-run
        options: [tick, inspect, discover, discover-and-publish, preview-commentary, resume-publication, dry-run, publish, publish-next-slot, status]
      timer_source:
        description: Origin of the clock check
        type: choice
        default: operator
        options: [operator, cloudflare, mac-backup]
      publication_issue:
        description: Existing publication issue for explicit recovery only
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: gta6-cloud-pipeline
  cancel-in-progress: false
jobs:
  gate:
    if: vars.GTA6_CLOUD_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.operation != 'tick')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      required: ${{ steps.decision.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          GTA6_REQUESTED_OPERATION: ${{ inputs.operation }}
        run: python3 gta6/schedule.py
      - name: Record scheduler failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "[gta6-cloud-alert] Scheduler check $GITHUB_RUN_ID failed" --body "The hourly ledger check failed. Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  pipeline:
    needs: gate
    if: needs.gate.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set operation
        env:
          REQUESTED: ${{ inputs.operation }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "OPERATION=$REQUESTED" >> "$GITHUB_ENV"
          else
            echo 'OPERATION=tick' >> "$GITHUB_ENV"
          fi
      - run: pip install 'requests>=2.32,<3' 'yt-dlp==2026.10.26' 'Pillow>=10,<13'
      - if: env.OPERATION != 'preview-commentary'
        run: pip install 'playwright>=1.45,<2' 'autotok==2.1.0' 'youtube-upload @ git+https://github.com/tokland/youtube-upload.git@6a30b55d0fd4976571a5b9b34c01fd41cec49c7a'
      - if: env.OPERATION != 'preview-commentary'
        run: python gta6/patch_autotok.py
      - name: Install pinned upstream social CLIs
        if: env.OPERATION != 'preview-commentary'
        run: |
          git clone https://github.com/dreammis/social-auto-upload.git /tmp/sau
          git -C /tmp/sau checkout 3847fff01f5434a8a32829833163cd6723cabc59
          cp /tmp/sau/conf.example.py /tmp/sau/conf.py
          git -C /tmp/sau apply "$GITHUB_WORKSPACE/gta6/social-auto-upload-instagram.patch"
          git -C /tmp/sau apply "$GITHUB_WORKSPACE/gta6/social-auto-upload-youtube.patch"
          pip install -e /tmp/sau
      - name: Prepare FFmpeg and FFprobe
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            exit 0
          fi
          if sudo timeout --kill-after=5s 55s bash -c 'apt-get update -qq && apt-get install -y -qq ffmpeg'; then
            exit 0
          fi
          bundle="$RUNNER_TEMP/gta6-ffmpeg.tar.xz"
          binaries="$RUNNER_TEMP/gta6-ffmpeg"
          mkdir -p "$binaries"
          curl --fail --silent --show-error --location --retry 1 --max-time 90 \
            'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-25-12-41/ffmpeg-n8.1.3-41-ga8029b6528-linux64-gpl-8.1.tar.xz' -o "$bundle"
          printf '%s  %s\n' '52e5d6c80ef213861dcdbdf5f742c551469ee7de91b3a846256660c9d0943997' "$bundle" | sha256sum --check
          tar -xJf "$bundle" -C "$binaries" --strip-components=2 \
            ffmpeg-n8.1.3-41-ga8029b6528-linux64-gpl-8.1/bin/ffmpeg \
            ffmpeg-n8.1.3-41-ga8029b6528-linux64-gpl-8.1/bin/ffprobe
          "$binaries/ffmpeg" -version | head -n 1
          "$binaries/ffprobe" -version | head -n 1
          printf '%s\n' "$binaries" >> "$GITHUB_PATH"
      - if: env.OPERATION == 'tick' || env.OPERATION == 'discover' || env.OPERATION == 'discover-and-publish' || env.OPERATION == 'publish' || env.OPERATION == 'publish-next-slot' || env.OPERATION == 'dry-run' || env.OPERATION == 'resume-publication'
        run: playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_gta6*.py' -v
      - name: Run verified cloud pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
          SAU_REPO: /tmp/sau
          GTA6_YOUTUBE_API_ENABLED: ${{ vars.GTA6_YOUTUBE_API_ENABLED }}
          GTA6_YOUTUBE_API_CLIENT_ID: ${{ secrets.GTA6_YOUTUBE_API_CLIENT_ID }}
          GTA6_YOUTUBE_API_CLIENT_SECRET: ${{ secrets.GTA6_YOUTUBE_API_CLIENT_SECRET }}
          GTA6_YOUTUBE_API_REFRESH_TOKEN: ${{ secrets.GTA6_YOUTUBE_API_REFRESH_TOKEN }}
          GTA6_YOUTUBE_CLI_ENABLED: ${{ vars.GTA6_YOUTUBE_CLI_ENABLED }}
          GTA6_YOUTUBE_BROWSER_SESSION: ${{ secrets.GTA6_YOUTUBE_BROWSER_SESSION }}
          GTA6_INSTAGRAM_BROWSER_SESSION: ${{ secrets.GTA6_INSTAGRAM_BROWSER_SESSION }}
          GTA6_TIKTOK_SESSION: ${{ secrets.GTA6_TIKTOK_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GTA6_COMMENTARY_ENABLED: ${{ vars.GTA6_COMMENTARY_ENABLED }}
          GTA6_RESUME_ISSUE: ${{ inputs.publication_issue }}
        run: python gta6_cloud.py "$OPERATION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gta6-cloud-results
          path: |
            gta6-output/cloud-accounts.json
            gta6-output/selection.json
            gta6-output/cloud-delivery.json
            gta6-output/instagram-cli-result.json
            gta6-output/instagram-auth-check.json
            gta6-output/youtube-upload-screen.txt
            gta6-output/youtube-api-result.json
            gta6-output/discovery.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gta6-commentary
          path: |
            gta6-output/production/commentary.mp4
            gta6-output/production/production.json
            gta6-output/production/story.json
            gta6-output/production/script.txt
            gta6-output/production/captions.ass
            gta6-output/production/quality-review.json
            gta6-output/production/narration-alignment.json
            gta6-output/production/narration.mp3
            gta6-output/production/joined.mp4
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: (env.OPERATION == 'tick' || env.OPERATION == 'discover' || env.OPERATION == 'discover-and-publish') && always()
        with:
          name: gta6-reviewed-media
          path: gta6-output/media/*.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Record a cloud failure for review
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "[gta6-cloud-alert] Run $GITHUB_RUN_ID failed" --body "Cloud GTA6 run failed: $RUN_URL. Inspect the durable publication reservation before retrying. Never repeat a batch after partial success. A login refresh, account reconnection, review-model quota, or discovery investigation may be needed."
