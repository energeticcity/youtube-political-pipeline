name: Inspect Failed Archive Preparation
on:
  workflow_dispatch:
    inputs:
      slot_issue:
        description: Occupied failed preparation slot issue; read only
        required: true
        type: string
      source_issue:
        description: Original passed source issue; read only
        required: true
        type: string
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3'
      - name: Read existing duplicate and narration-history evidence only
        env:
          GH_TOKEN: ${{ github.token }}
          POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
          CLIP_DESTINATIONS_JSON: ${{ vars.CLIP_DESTINATIONS_JSON }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SLOT_ISSUE: ${{ inputs.slot_issue }}
          SOURCE_ISSUE: ${{ inputs.source_issue }}
        run: python archive_preparation_recovery.py --slot-issue "$SLOT_ISSUE" --source-issue "$SOURCE_ISSUE"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-preparation-recovery-check
          path: recovery-output/
          retention-days: 7
