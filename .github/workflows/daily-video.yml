name: The Past Was Ridiculous
on:
  schedule:
    - cron: '7 14,18,22 * * *'
  workflow_dispatch:
    inputs:
      episode:
        description: Optional episode ID to regenerate; blank selects next story
        required: false
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: archive-previews
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install 'requests>=2.32,<3'
      - run: python -m unittest discover -s tests -v
      - name: Build the next archival story
        env:
          GH_TOKEN: ${{ github.token }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          EPISODE: ${{ inputs.episode }}
        run: python archive_pipeline.py preview --episode "$EPISODE"
      - name: Identify existing destinations (read only)
        continue-on-error: true
        env:
          POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
        run: python archive_pipeline.py accounts
      - uses: actions/upload-artifact@v4
        with:
          name: archive-preview
          path: clip-output/
          retention-days: 30
          if-no-files-found: error
      - name: Record preview completion
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python archive_pipeline.py mark-preview
