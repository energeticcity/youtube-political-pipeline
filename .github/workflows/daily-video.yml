name: The Past Was Ridiculous
run-name: ${{ inputs.episode == 'audio-review' && 'Archive audio review (no publication)' || 'The Past Was Ridiculous' }}
on:
  schedule:
    - cron: '7 14 * * *'
    - cron: '7 18 * * *'
    - cron: '7 22 * * *'
  workflow_dispatch:
    inputs:
      episode:
        description: Optional episode ID; auto tests refill; blank selects next story or refills
        required: false
        type: string
      slot_utc:
        description: Intended existing UTC slot for production recovery (YYYY-MM-DDTHH:07:00Z); no future/backlog slots
        required: false
        type: string
      audio_review_run:
        description: Existing run to audition when episode is audio-review; no new video or export
        required: false
        type: string
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: archive-previews
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install 'requests>=2.32,<3'
      - run: python -m unittest discover -s tests -v
      - name: Claim intended calendar slot before paid work
        id: admission
        if: github.ref == 'refs/heads/main' && inputs.episode != 'audio-review'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SLOT_REQUEST: ${{ inputs.slot_utc }}
          CLIP_PUBLISH_ENABLED: ${{ vars.CLIP_PUBLISH_ENABLED }}
          CLIP_AUTO_PUBLISH_ENABLED: ${{ vars.CLIP_AUTO_PUBLISH_ENABLED }}
        run: python archive_slots.py admit
      - name: Build the next archival story
        if: github.ref != 'refs/heads/main' || inputs.episode == 'audio-review' || steps.admission.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EPISODE: ${{ inputs.episode }}
          AUDIO_REVIEW_RUN: ${{ inputs.audio_review_run }}
        run: |
          if [ "$EPISODE" = audio-review ]; then
            python archive_audio_quality.py --run-id "$AUDIO_REVIEW_RUN"
          elif [ "$EPISODE" = kitchen-v2-test ] || [ "$EPISODE" = bart-private-test ]; then
            python preview_kitchen_v2.py
          else
            python archive_pipeline.py preview --episode "$EPISODE"
          fi
      - name: Identify existing destinations (read only)
        if: inputs.episode != 'audio-review' && (github.ref != 'refs/heads/main' || steps.admission.outputs.allowed == 'true')
        continue-on-error: true
        env:
          POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
        run: python archive_pipeline.py accounts
      - uses: actions/upload-artifact@v4
        if: inputs.episode != 'audio-review' && (github.ref != 'refs/heads/main' || steps.admission.outputs.allowed == 'true')
        with:
          name: archive-preview
          path: clip-output/
          retention-days: 30
          if-no-files-found: error
      - name: Record preview completion
        if: github.ref == 'refs/heads/main' && inputs.episode != 'audio-review' && steps.admission.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python archive_pipeline.py mark-preview
          python archive_slots.py ready
      - name: Save preparation diagnostics
        if: always() && inputs.episode != 'audio-review'
        uses: actions/upload-artifact@v4
        with:
          name: archive-refill-diagnostics
          path: |
            clip-output/refill-diagnostics.json
            clip-output/preparation-diagnostics.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain failed occupied slot
        if: failure() && github.ref == 'refs/heads/main' && steps.admission.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python archive_slots.py failed
      - name: Report a failed scheduled slot
        if: failure() && github.ref == 'refs/heads/main' && inputs.episode != 'audio-review'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue create --title "Archive video slot failed (run $GITHUB_RUN_ID)" --body "Automatic preparation failed. No unchecked video was submitted. Inspect $RUN_URL before retrying."
