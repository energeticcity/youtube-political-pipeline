name: Check Archive Delivery
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Post for Me post ID from publication issue
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3'
      - name: Read delivery status
        env:
          POST_ID: ${{ inputs.post_id }}
          POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
          CLIP_DESTINATIONS_JSON: ${{ vars.CLIP_DESTINATIONS_JSON }}
        run: python archive_pipeline.py delivery --post-id "$POST_ID" --output delivery-output
      - uses: actions/upload-artifact@v4
        with:
          name: archive-delivery
          path: delivery-output/
          retention-days: 7
